services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Lets the deploy prune only this project's superseded images.
      labels:
        com.oniria.project: webpage
    image: oniria-web:latest
    container_name: oniria-web
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - oniria

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: oniria-tunnel
    command: tunnel --no-autoupdate run
    environment:
      # Read from the `.env` file next to this compose file (compose does not
      # interpolate from .env.local), or from the deploy shell's environment.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is not set}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    networks:
      - oniria

networks:
  oniria:
    driver: bridge
