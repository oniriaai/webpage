version: 2

# Monthly and grouped, so each ecosystem produces one PR that the CI gate
# checks in a single run rather than a stream of individual bumps.
updates:
  - package-ecosystem: npm # also covers pnpm-lock.yaml
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      all-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all-actions:
        patterns:
          - '*'
